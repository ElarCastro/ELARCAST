<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>ELARCAST - Gráfico destacado (1024x500)</title>
<style>
  html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#03040a}
  .fg{position:relative;width:1024px;height:500px;overflow:hidden;font-family:"Segoe UI","Roboto",Arial,sans-serif;
    background:radial-gradient(ellipse 70% 90% at 22% 50%,#16205a 0%,#070914 55%,#020205 100%)}
  .grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(#2F6BFF 1px,transparent 1px),linear-gradient(90deg,#2F6BFF 1px,transparent 1px);background-size:40px 40px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 45%,transparent 100%)}
  .glow{position:absolute;width:520px;height:520px;left:-20px;top:-10px;border-radius:50%;background:radial-gradient(#2F6BFF55,transparent 65%)}
  .logo{position:absolute;left:48px;top:50px;width:400px;height:400px}
  .txt{position:absolute;left:480px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
  .name{font-size:86px;font-weight:800;letter-spacing:4px;line-height:1;background:linear-gradient(90deg,#00E5FF,#2F6BFF 55%,#9B4DFF);-webkit-background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(47,107,255,.55))}
  .sub{margin-top:12px;font-size:27px;font-weight:600;letter-spacing:7.5px;color:#d9f6ff}
  .bar{margin:26px 0 22px;width:420px;height:4px;border-radius:2px;background:linear-gradient(90deg,#00E5FF,#9B4DFF)}
  .tags{font-size:23px;color:#9fb4ff;letter-spacing:1px}
  .cred{margin-top:16px;font-size:19px;color:#7f8bb8}
</style></head>
<body><div class="fg">
  <div class="grid"></div><div class="glow"></div>
  <img class="logo" src="elarcast_icono.svg" alt="">
  <div class="txt">
    <div class="name">ELARCAST</div>
    <div class="sub">MULTIMEDIA PLAYER</div>
    <div class="bar"></div>
    <div class="tags">Música · Videos · TV en vivo · Radios</div>
    <div class="cred">Creación: Elar Castro con la IA</div>
  </div>
</div></body></html>
