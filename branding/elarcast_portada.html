<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>ELARCAST - Portada (1600x900)</title>
<style>
  html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#03040a}
  .p{position:relative;width:1600px;height:900px;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(ellipse 60% 55% at 50% 30%,#18225e 0%,#070914 60%,#020205 100%)}
  .grid{position:absolute;inset:0;opacity:.13;background-image:linear-gradient(#2F6BFF 1px,transparent 1px),linear-gradient(90deg,#2F6BFF 1px,transparent 1px);background-size:48px 48px;
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 80%)}
  .head{position:absolute;top:44px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:26px}
  .head img{width:112px;height:112px;filter:drop-shadow(0 0 18px rgba(47,107,255,.55))}
  .name{font-size:84px;font-weight:800;letter-spacing:6px;line-height:1;background:linear-gradient(90deg,#00E5FF,#2F6BFF 55%,#9B4DFF);-webkit-background-clip:text;color:transparent}
  .sub{margin-top:8px;font-size:22px;font-weight:600;letter-spacing:9px;color:#d9f6ff}
  .row{position:absolute;left:0;right:0;top:232px;display:flex;justify-content:center;align-items:flex-start;gap:44px}
  .ph{width:286px;height:572px;border-radius:34px;padding:9px;background:linear-gradient(160deg,#2a3470,#0b0f2a);box-shadow:0 22px 50px rgba(0,0,0,.6),0 0 0 1px rgba(127,140,255,.25),0 0 40px rgba(47,107,255,.18)}
  .ph.up{transform:translateY(-22px)}
  .ph img{display:block;width:100%;height:100%;border-radius:26px;object-fit:cover;object-position:center top}
  .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:20px;color:#8f9cd0;letter-spacing:1px}
  .cap b{color:#cfe0ff;font-weight:600}
</style></head>
<body><div class="p">
  <div class="grid"></div>
  <div class="head"><img src="elarcast_icono.svg" alt=""><div><div class="name">ELARCAST</div><div class="sub">MULTIMEDIA PLAYER</div></div></div>
  <div class="row">
    <div class="ph"><img src="capturas/01-inicio.png" alt=""></div>
    <div class="ph up"><img src="capturas/02-lista.png" alt=""></div>
    <div class="ph up"><img src="capturas/04-efectos.png" alt=""></div>
    <div class="ph"><img src="capturas/06-radios.png" alt=""></div>
  </div>
  <div class="cap"><b>Música · Videos · TV en vivo · Radios</b> &nbsp;—&nbsp; Creación: Elar Castro con la IA</div>
</div></body></html>
